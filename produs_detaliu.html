<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmmDor Beauty | Detalii Produs</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Stiluri specifice paginii de produs Sephora-style */
        .p-page-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; background: #fff; }
        .p-img-wrapper img { width: 100%; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); object-fit: cover; }
        .p-brand { font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #555; margin-bottom: 5px; }
        .p-title { font-family: 'Cinzel', serif; font-size: 32px; color: #000; margin-bottom: 15px; }
        .p-stars { color: #d4af37; font-size: 14px; margin-bottom: 20px; }
        .p-stars span { color: #777; font-size: 13px; margin-left: 8px; }
        .p-price { font-size: 26px; font-weight: 700; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        
        /* Selector Nuanțe */
        .shade-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
        .shade-title span { font-weight: 400; color: #666; }
        .shades-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }
        .shade-btn { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #fff; outline: 1px solid #ddd; cursor: pointer; transition: 0.2s; }
        .shade-btn:hover { transform: scale(1.1); }
        .shade-btn.active { outline: 2px solid #000; transform: scale(1.05); }

        /* Butoane Acțiune */
        .action-row { display: flex; gap: 15px; margin-bottom: 40px; }
        .btn-add { flex: 1; background: #000; color: #fff; border: none; font-weight: 700; padding: 15px; cursor: pointer; transition: 0.3s; }
        .btn-add:hover { background: #333; }
        .btn-fav { width: 50px; background: transparent; border: 1px solid #ccc; cursor: pointer; font-size: 18px; }

        /* Tab-uri */
        .tabs-header { display: flex; border-bottom: 2px solid #eee; gap: 30px; margin-bottom: 20px; }
        .tab-btn { background: none; border: none; font-size: 14px; font-weight: 600; padding: 10px 0; cursor: pointer; color: #888; position: relative; }
        .tab-btn.active { color: #000; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 2px; background: #000; }
        .tab-content { font-size: 14px; line-height: 1.6; color: #444; display: none; }
        .tab-content.active { display: block; }
        
        /* Recenzii */
        .review-card { border-bottom: 1px solid #eee; padding: 15px 0; }
        .review-card h5 { margin: 0 0 5px 0; font-size: 14px; }
        .review-card p { margin: 5px 0 0 0; font-size: 13px; color: #666; }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="logo-container">
                <div class="logo-badge">ED</div>
                <div class="logo-text"><span class="brand-name">EMMDOR</span><span class="brand-sub">BEAUTY</span></div>
            </a>
            <div class="header-icons">
                <a href="favorite.html"><i class="fa-regular fa-heart"></i><span class="badge" id="fav-count">0</span></a>
                <a href="cos.html"><i class="fa-solid fa-bag-shopping"></i><span class="badge" id="cart-count">0</span></a>
            </div>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">ACASĂ</a></li>
                <li><a href="produse.html">TOATE PRODUSELE</a></li>
                <li><a href="branduri_accesibile.html">BRANDURI ACCESIBILE</a></li>
                <li><a href="branduri_lux.html">BRANDURI LUX</a></li>
                <li><a href="promotii.html" class="sale-link">PROMOȚII %</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <div id="product-mount"></div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get('id'));
            const product = allProducts.find(p => p.id === id);

            if (!product) {
                document.getElementById('product-mount').innerHTML = '<h2 style="text-align:center; padding: 50px;">Produsul nu a fost găsit.</h2>';
                return;
            }

            // Date implicite (dacă nu le-ai adăugat încă în script.js)
            const details = product.details || "Produs de înaltă calitate, recunoscut pentru rezistența sa îndelungată și aplicarea ușoară. Testat dermatologic.";
            const ingredients = product.ingredients || "AQUA (WATER), DIMETHICONE, GLYCERIN, ISODODECANE, PEG-10 DIMETHICONE, CI 77891 (TITANIUM DIOXIDE).";
            const reviews = product.reviews || [
                { user: "Andreea M.", rating: 5, text: "Ador acest produs! Îl folosesc zilnic și rezistă perfect." },
                { user: "Elena P.", rating: 4, text: "Culoare foarte frumoasă, raport calitate-preț excelent." }
            ];
            const shades = product.shades || [];
            
            // Variabilă globală pentru a salva nuanța
            window.selectedShade = shades.length > 0 ? shades[0] : null;

            function renderProduct() {
                const displayImg = window.selectedShade && window.selectedShade.img ? window.selectedShade.img : product.img;
                const priceHtml = product.oldPrice 
                    ? `<span style="text-decoration:line-through; color:#999; font-size:18px; margin-right:10px;">${product.oldPrice.toFixed(2)} Lei</span><span style="color:#e63946;">${product.price.toFixed(2)} Lei</span>` 
                    : `${product.price.toFixed(2)} Lei`;

                document.getElementById('product-mount').innerHTML = `
                    <div class="p-page-container">
                        <div class="p-img-wrapper">
                            <img src="${displayImg}" alt="${product.name}">
                        </div>
                        <div class="p-info-wrapper">
                            <div class="p-brand">${product.brand}</div>
                            <h1 class="p-title">${product.name}</h1>
                            <div class="p-stars">
                                <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star-half-stroke"></i>
                                <span>(${reviews.length} recenzii)</span>
                            </div>
                            <div class="p-price">${priceHtml}</div>

                            ${shades.length > 0 ? `
                                <div class="shade-title">Nuanță selectată: <span>${window.selectedShade.name}</span></div>
                                <div class="shades-grid">
                                    ${shades.map((s, idx) => `
                                        <button class="shade-btn ${window.selectedShade.name === s.name ? 'active' : ''}" 
                                                style="background-color: ${s.color};" 
                                                title="${s.name}" 
                                                onclick="changeShade(${idx})"></button>
                                    `).join('')}
                                </div>
                            ` : ''}

                            <div class="action-row">
                                <button class="btn-add" onclick="handleAdd()">ADAUGĂ ÎN COȘ</button>
                                <button class="btn-fav" onclick="toggleFavorite(${product.id})"><i class="fa-regular fa-heart"></i></button>
                            </div>

                            <div class="tabs-container">
                                <div class="tabs-header">
                                    <button class="tab-btn active" onclick="switchTab('tab-details', this)">Detalii</button>
                                    <button class="tab-btn" onclick="switchTab('tab-ingredients', this)">Ingrediente</button>
                                    <button class="tab-btn" onclick="switchTab('tab-reviews', this)">Recenzii</button>
                                </div>
                                <div id="tab-details" class="tab-content active">${details}</div>
                                <div id="tab-ingredients" class="tab-content">${ingredients}</div>
                                <div id="tab-reviews" class="tab-content">
                                    ${reviews.map(r => `
                                        <div class="review-card">
                                            <h5>${r.user} <span style="color:#d4af37; margin-left:10px;"><i class="fa-solid fa-star"></i> ${r.rating}/5</span></h5>
                                            <p>"${r.text}"</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Funcții pentru pagină
            window.switchTab = function(tabId, btn) {
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
                document.getElementById(tabId).classList.add('active');
                btn.classList.add('active');
            };

            window.changeShade = function(index) {
                window.selectedShade = shades[index];
                renderProduct();
            };

            window.handleAdd = function() {
                const itemToAdd = {
                    ...product,
                    selectedShadeName: window.selectedShade ? window.selectedShade.name : null,
                    img: (window.selectedShade && window.selectedShade.img) ? window.selectedShade.img : product.img
                };
                
                const existing = cart.find(i => i.id === product.id && i.selectedShadeName === itemToAdd.selectedShadeName);
                if (existing) {
                    existing.qty += 1;
                } else {
                    cart.push({ ...itemToAdd, qty: 1 });
                }
                localStorage.setItem('emmdor_cart', JSON.stringify(cart));
                updateBadges();
                alert(`"${product.name}" a fost adăugat în coș!`);
            };

            renderProduct();
        });
    </script>
</body>
</html>
